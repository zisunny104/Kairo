<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: https://cloudflareinsights.com; img-src 'self' data:; object-src 'none'; base-uri 'self';">
  <title>實驗檔案庫 | 碩論進行中</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css" data-versioned>
  <link rel="stylesheet" href="css/archive/archive.css" data-versioned>
</head>

<body class="archive-page">
  <div class="container">
    <button class="archive-panel-toggle" id="archivePanelToggle" title="收折/展開左側面板">
      <i class="archive-panel-toggle-icon" id="panelToggleIcon">&#8249;</i>
    </button>

    <!-- ===== 檔案清單側邊欄 ===== -->
    <div class="archive-sidebar" id="archiveLeftPanel">
      <h1 class="experiment-title">實驗檔案庫</h1>

      <!-- 伺服器日誌 -->
      <div class="input-section board-section" id="serverFilesSection">
        <div class="archive-section-row">
          <h2>伺服器日誌</h2>
          <div class="archive-section-actions">
            <button class="archive-icon-btn" id="serverSearchToggleBtn" title="搜尋">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </button>
            <button class="archive-icon-btn" id="serverFilterToggleBtn" title="篩選">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 4h18" />
                <path d="M6 10h12" />
                <path d="M10 16h4" />
              </svg>
            </button>
            <button class="archive-icon-btn" id="refreshServerBtn" title="重新整理">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6" />
                <path d="M1 20v-6h6" />
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
              </svg>
            </button>
          </div>
        </div>
        <div id="serverFilesList">
          <div class="archive-status">載入中…</div>
        </div>
      </div>

      <!-- 上傳本機檔案 -->
      <div class="input-section board-section" id="uploadSection">
        <h2>上傳本機檔案</h2>
        <div class="upload-zone" id="uploadZone">
          <p>拖放 .jsonl 至此，或</p>
          <button class="btn-upload" id="uploadBtn">選擇檔案</button>
          <input type="file" id="archiveFileInput" accept=".jsonl" multiple style="display:none">
        </div>
        <p class="archive-upload-hint">本機檔案可在工具列上傳至伺服器</p>
        <div id="localFilesList"></div>
      </div>
    </div>

    <!-- ===== 檔案檢視區（工具列 + 內容皆由 JS 填入 archiveViewer） ===== -->
    <div class="archive-viewer-panel">

      <!-- Tab 列 -->
      <div class="archive-panel-tabs">
        <button class="archive-panel-tab is-active" data-tab="viewer">日誌檢視</button>
        <button class="archive-panel-tab archive-panel-tab--orange" data-tab="quick-remark">簡易標記</button>
        <button class="archive-panel-tab archive-panel-tab--teal" data-tab="assist-mark">輔助標記</button>
        <button class="archive-panel-tab archive-panel-tab--indigo" data-tab="match-mark">名單比對</button>
        <button class="archive-panel-tab archive-panel-tab--violet" data-tab="final-analysis">最終分析</button>
        <button class="archive-panel-tab archive-panel-tab--rose" data-tab="questionnaire">問卷分析</button>
      </div>

      <!-- Tab：日誌檢視 -->
      <div id="archiveViewer">
        <div class="archive-viewer-state">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
            <polyline points="14,2 14,8 20,8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
          <p>從左側選擇日誌檔案以檢視內容</p>
        </div>
      </div>

      <!-- Tab：簡易標記 -->
      <div id="archiveQuickRemark" class="archive-quick-remark is-hidden">
        <div class="archive-viewer-state">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#e67e22" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <p style="color:#e67e22">簡易標記功能開發中…</p>
        </div>
      </div>

      <!-- Tab：輔助標記 -->
      <div id="archiveAssistMark" class="archive-assist-mark is-hidden">
        <div class="archive-viewer-state">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#0f8b8d" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7h18" />
            <path d="M3 12h18" />
            <path d="M3 17h18" />
            <path d="M7 3v18" />
            <path d="M12 3v18" />
            <path d="M17 3v18" />
          </svg>
          <p style="color:#0f8b8d">輔助標記功能載入中…</p>
        </div>
      </div>

      <!-- Tab：名單比對 -->
      <div id="archiveMatchMark" class="archive-match-mark is-hidden">
        <div class="archive-viewer-state">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#5c6bc0" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <p style="color:#5c6bc0">名單比對功能載入中…</p>
        </div>
      </div>

      <!-- Tab：最終分析 -->
      <div id="archiveFinalAnalysis" class="archive-final-analysis is-hidden">
        <div class="archive-viewer-state">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#8e44ad" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
          <p style="color:#8e44ad">最終分析功能載入中…</p>
        </div>
      </div>

      <!-- Tab：問卷分析 -->
      <div id="archiveQuestionnaire" class="archive-questionnaire is-hidden">
        <div class="archive-viewer-state">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#d81b60" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
          <p style="color:#d81b60">問卷分析功能載入中…</p>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="./js/archive/archive-tabs.js"></script>
  <script type="module" src="./js/archive/archive-init.js"></script>
</body>

</html>
